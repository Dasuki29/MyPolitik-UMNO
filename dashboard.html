<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Game Utama - UMNO Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff; min-height: 100vh; margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      transition: background-color 0.3s;
    }

    /* Variasi Tema Background */
    body.theme-dark { background-color: #1a1a2e; }
    body.theme-blue { background-color: #0f172a; }
    body.theme-gold { background-color: #2a2115; }

    .dashboard-container {
      width: 100%; max-width: 800px; background: rgba(22, 33, 62, 0.95);
      border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* Profil Header */
    .profile-bar {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid #1f4068; padding-bottom: 15px; margin-bottom: 20px;
    }
    .user-info { display: flex; align-items: center; gap: 15px; }
    .user-avatar { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #e94560; object-fit: cover; }
    .user-details h3 { margin: 0; font-size: 20px; color: #fff; }
    .badge-lokaliti {
      display: inline-block; background: #e94560; color: #fff; padding: 4px 10px;
      border-radius: 12px; font-size: 12px; font-weight: bold; margin-top: 5px;
    }

    /* Audio Controller */
    .audio-controls { display: flex; gap: 8px; align-items: center; }
    .btn-audio {
      background: #0f3460; border: 1px solid #1f4068; color: #fff;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }

    /* Game Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat-card {
      background: #0f3460; padding: 15px; border-radius: 8px; text-align: center;
      border: 1px solid #1f4068;
    }
    .stat-card h4 { margin: 0; font-size: 13px; color: #a0a0a0; }
    .stat-card .value { font-size: 22px; font-weight: bold; color: #e94560; margin-top: 5px; }

    /* Game Area / Main Content */
    .game-content {
      background: #0f3460; padding: 30px; border-radius: 8px; text-align: center;
      border: 2px dashed #1f4068; min-height: 200px;
    }

    .btn-action {
      padding: 12px 24px; background: #e94560; color: #fff; border: none;
      border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px;
    }
  </style>
</head>
<body id="bodyTag" class="theme-dark">

  <!-- Audio Element -->
  <audio id="bgmAudio" loop autoplay>
    <source src="lagu-bgm.mp3" type="audio/mpeg">
  </audio>

  <div class="dashboard-container">
    <!-- BAR PROFIL PEMAIN -->
    <div class="profile-bar">
      <div class="user-info">
        <img id="displayAvatar" src="avatar1.png" alt="Avatar" class="user-avatar">
        <div class="user-details">
          <h3 id="displayNama">Nama Pemain</h3>
          <span id="displayLokaliti" class="badge-lokaliti">Cawangan: -</span>
        </div>
      </div>

      <!-- KAWALAN AUDIO -->
      <div class="audio-controls">
        <button class="btn-audio" onclick="toggleAudio()">🔊 Play/Pause BGM</button>
      </div>
    </div>

    <!-- STATS GAME PEMAIN -->
    <div class="stats-grid">
      <div class="stat-card">
        <h4>LEVEL PEMAIN</h4>
        <div class="value" id="valLevel">1</div>
      </div>
      <div class="stat-card">
        <h4>JUMLAH MARKAH</h4>
        <div class="value" id="valMarkah">150</div>
      </div>
      <div class="stat-card">
        <h4>MISI CAWANGAN</h4>
        <div class="value" id="valMisi">2 / 5</div>
      </div>
    </div>

    <!-- KAWASAN MAIN GAME / DASHBOARD -->
    <div class="game-content">
      <h2>PAPAN KAWALAN GAME</h2>
      <p>Selamat datang ke zon permainan lokaliti anda! Semua tugasan dan data anda telah dimuatkan.</p>
      
      <button class="btn-action" onclick="tambahMarkah()">JALANKAN MISI CAWANGAN (+50 PTS)</button>
    </div>

    <!-- BUTTON TUKAR PROFIL / LOKALITI -->
    <div style="text-align: center; margin-top: 20px;">
      <button class="btn-audio" onclick="window.location.href='index.html'">Tukar Karakter / Lokaliti</button>
    </div>
  </div>

  <script>
    const bgmAudio = document.getElementById('bgmAudio');

    // 1. MEMBACA SEMUA DATA PEMAIN DARI LOCALSTORAGE
    const nama = localStorage.getItem('playerNama') || 'Pemain Utama';
    const avatar = localStorage.getItem('playerAvatar') || 'avatar1.png';
    const tema = localStorage.getItem('playerTema') || 'dark';
    const lokalitiNama = localStorage.getItem('selectedLokalitiNama') || 'Tiada Cawangan';

    // 2. PAPARKAN DATA KE DASHBOARD
    document.getElementById('displayNama').textContent = nama;
    document.getElementById('displayAvatar').src = avatar;
    document.getElementById('displayLokaliti').textContent = `Cawangan: ${lokalitiNama}`;
    document.getElementById('bodyTag').className = `theme-${tema}`;

    // 3. FUNGSI KAWALAN AUDIO
    function toggleAudio() {
      if (bgmAudio.paused) {
        bgmAudio.play();
      } else {
        bgmAudio.pause();
      }
    }

    // 4. FUNGSI SIMULASI GAME
    let markah = 150;
    function tambahMarkah() {
      markah += 50;
      document.getElementById('valMarkah').textContent = markah;
      alert(`Tahniah ${nama}! Misi cawangan ${lokalitiNama} berjaya diselesaikan.`);
    }
  </script>
</body>
</html>
