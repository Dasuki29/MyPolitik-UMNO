<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Ilustrasi menara pejabat di waktu senja">
  <!-- Ilustrasi asal (bukan foto). Letak foto sebenar di menara-dato-onn.jpg untuk menggantikannya. -->
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b24"/>
      <stop offset=".35" stop-color="#1c1b4a"/>
      <stop offset=".62" stop-color="#6a2f5a"/>
      <stop offset=".82" stop-color="#e0683a"/>
      <stop offset="1" stop-color="#f6a53f"/>
    </linearGradient>
    <radialGradient id="cahaya" cx=".5" cy=".86" r=".55">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1f33"/>
      <stop offset=".55" stop-color="#2a3050"/>
      <stop offset="1" stop-color="#3a3340"/>
    </linearGradient>
    <pattern id="tingkap" width="14" height="24" patternUnits="userSpaceOnUse">
      <rect width="14" height="24" fill="none"/>
      <rect x="2" y="4" width="10" height="14" fill="#ffd98a" opacity=".14"/>
    </pattern>
    <pattern id="tingkapMenyala" width="42" height="72" patternUnits="userSpaceOnUse">
      <rect x="16" y="4" width="10" height="14" fill="#ffd98a" opacity=".85"/>
      <rect x="2" y="28" width="10" height="14" fill="#ffd98a" opacity=".7"/>
      <rect x="30" y="52" width="10" height="14" fill="#ffd98a" opacity=".75"/>
    </pattern>
    <linearGradient id="kabus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a53f" stop-opacity="0"/>
      <stop offset="1" stop-color="#f6a53f" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1600" fill="url(#langit)"/>
  <rect width="800" height="1600" fill="url(#cahaya)"/>

  <!-- bintang -->
  <g fill="#fff" opacity=".7">
    <circle cx="90" cy="120" r="1.6"/><circle cx="210" cy="60" r="1.2"/><circle cx="330" cy="180" r="1.4"/>
    <circle cx="470" cy="90" r="1.6"/><circle cx="600" cy="150" r="1.2"/><circle cx="720" cy="70" r="1.5"/>
    <circle cx="660" cy="260" r="1.1"/><circle cx="150" cy="300" r="1.1"/><circle cx="540" cy="330" r="1.3"/>
  </g>

  <!-- bangunan jauh -->
  <g fill="#2a2150" opacity=".75">
    <rect x="0" y="1010" width="70" height="390"/><rect x="70" y="960" width="50" height="440"/>
    <rect x="120" y="1060" width="80" height="340"/><rect x="560" y="1000" width="60" height="400"/>
    <rect x="620" y="940" width="55" height="460"/><rect x="675" y="1050" width="125" height="350"/>
    <rect x="200" y="1100" width="60" height="300"/>
  </g>
  <g fill="#1d1840" opacity=".9">
    <rect x="20" y="1120" width="90" height="280"/><rect x="620" y="1130" width="80" height="270"/>
    <rect x="705" y="1090" width="95" height="310"/>
  </g>

  <!-- menara utama -->
  <g>
    <rect x="352" y="1090" width="96" height="310" fill="#242842"/>
    <rect x="330" y="470" width="140" height="930" fill="url(#badan)"/>
    <rect x="330" y="470" width="140" height="930" fill="url(#tingkap)"/>
    <rect x="330" y="470" width="140" height="930" fill="url(#tingkapMenyala)"/>
    <rect x="322" y="470" width="8" height="930" fill="#12152a"/>
    <rect x="470" y="470" width="8" height="930" fill="#4a3a48"/>
    <!-- mahkota bertingkat -->
    <rect x="344" y="446" width="112" height="24" fill="#2f3556"/>
    <rect x="364" y="422" width="72" height="24" fill="#2a2f4e"/>
    <rect x="388" y="402" width="24" height="20" fill="#232843"/>
    <rect x="398" y="330" width="4" height="72" fill="#c9ccd8"/>
    <circle cx="400" cy="326" r="5" fill="#e8344f"/>
    <circle cx="400" cy="326" r="14" fill="#e8344f" opacity=".25"/>
    <!-- pita pegun -->
    <rect x="330" y="760" width="140" height="6" fill="#12152a" opacity=".6"/>
    <rect x="330" y="1040" width="140" height="6" fill="#12152a" opacity=".6"/>
    <!-- lobi -->
    <rect x="318" y="1330" width="164" height="70" fill="#1a1e36"/>
    <rect x="336" y="1346" width="128" height="54" fill="#ffd98a" opacity=".22"/>
  </g>

  <!-- dewan rendah dengan bumbung melengkung -->
  <g>
    <rect x="70" y="1290" width="250" height="110" fill="#201f3d"/>
    <path d="M60 1292 Q195 1236 330 1292 Z" fill="#2c2a52"/>
    <g fill="#ffd98a" opacity=".5">
      <rect x="96" y="1320" width="14" height="40"/><rect x="132" y="1320" width="14" height="40"/>
      <rect x="168" y="1320" width="14" height="40"/><rect x="204" y="1320" width="14" height="40"/>
      <rect x="240" y="1320" width="14" height="40"/><rect x="276" y="1320" width="14" height="40"/>
    </g>
  </g>
  <rect x="478" y="1330" width="200" height="70" fill="#1b1a38"/>
  <rect x="478" y="1320" width="200" height="10" fill="#2a2850"/>

  <!-- kabus senja, jalan -->
  <rect x="0" y="1180" width="800" height="240" fill="url(#kabus)"/>
  <rect x="0" y="1400" width="800" height="200" fill="#0b0c1c"/>
  <rect x="0" y="1400" width="800" height="3" fill="#f6a53f" opacity=".35"/>
  <g stroke="#f6a53f" stroke-opacity=".25" stroke-width="3" stroke-dasharray="26 22">
    <line x1="0" y1="1500" x2="800" y2="1500"/>
  </g>

  <!-- pokok palma -->
  <g fill="#0a0b19">
    <rect x="618" y="1290" width="8" height="112"/>
    <path d="M622 1292 Q590 1262 556 1282 Q590 1274 622 1300 Z"/>
    <path d="M622 1292 Q654 1262 690 1282 Q654 1274 622 1300 Z"/>
    <path d="M622 1290 Q606 1250 576 1240 Q608 1252 624 1296 Z"/>
    <path d="M622 1290 Q640 1250 672 1242 Q640 1254 620 1296 Z"/>
    <rect x="52" y="1310" width="7" height="92"/>
    <path d="M56 1312 Q28 1288 0 1304 Q28 1298 56 1318 Z"/>
    <path d="M56 1312 Q84 1288 112 1304 Q84 1298 56 1318 Z"/>
  </g>
</svg>
