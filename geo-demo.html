<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ujian Peta Sempadan — MyPolitik: UMNO</title>
  <link rel="stylesheet" href="css/style.css">
  <style>body{padding:16px;max-width:1100px;margin:auto}.kad{margin-top:12px;padding:12px;border:1px solid var(--border,#2E333F);border-radius:12px}.kad pre{white-space:pre-wrap;margin:0;font-size:.8rem}</style>
</head>
<body>
  <h1>Peta Sempadan (ujian penyesuai geo.js)</h1>
  <p>Halaman ini hanya untuk menguji data dan loader. Ia tidak menyentuh logik permainan. Jika ada profil pemain dalam pelayar ini, kawasan anda disorot.</p>
  <div id="peta"></div>
  <div class="kad"><b>Kawasan dipilih</b><pre id="info">Klik satu kawasan.</pre></div>
  <script src="js/geo.js"></script>
  <script>
    (async function () {
      await MyPolitikGeo.muat();
      await MyPolitikGeo.muatDM('10');                 // Daerah Mengundi Selangor (pemilih sebenar)
      var profil = null;
      try { profil = JSON.parse(localStorage.getItem('myPolitik_player')); } catch (e) { /* tiada profil */ }
      MyPolitikGeo.mount(document.getElementById('peta'), {
        peringkat: 'negeri', warna: 'pemilih', fokus: profil || null,
        onPilih: function (f, dm) { document.getElementById('info').textContent = JSON.stringify(dm, null, 2); }
      });
    })();
  </script>
</body>
</html>
