<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Karakter & Lokaliti - UMNO Game</title>

  <!-- CSS & JS Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e; color: #ffffff;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
    }

    .setup-card {
      background: #16213e; padding: 30px; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); width: 100%; max-width: 480px;
      text-align: center;
    }

    .header-logo { width: 80px; margin-bottom: 10px; }
    h2 { color: #e94560; margin-top: 0; margin-bottom: 20px; letter-spacing: 1px; }

    .form-group { text-align: left; margin-bottom: 18px; }
    label { display: block; font-size: 14px; color: #a0a0a0; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"] {
      width: 100%; padding: 12px; background: #0f3460; border: 1px solid #1f4068;
      border-radius: 6px; color: #fff; font-size: 15px; outline: none;
    }

    /* Avatar Selection Grid */
    .avatar-grid { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
    .avatar-option {
      width: 65px; height: 65px; border-radius: 50%; border: 3px solid #1f4068;
      cursor: pointer; object-fit: cover; transition: 0.2s;
    }
    .avatar-option.selected { border-color: #e94560; transform: scale(1.1); }

    /* Background Theme Selection */
    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-btn {
      padding: 10px; border-radius: 6px; border: 2px solid #1f4068; background: #0f3460;
      color: #fff; cursor: pointer; text-align: center; font-size: 13px;
    }
    .theme-btn.selected { border-color: #e94560; background: #e94560; font-weight: bold; }

    /* Tom Select Styling */
    .ts-control { background-color: #0f3460 !important; color: #fff !important; border-radius: 6px !important; padding: 12px !important; }
    .ts-control input { color: #fff !important; }
    .ts-dropdown { background-color: #0f3460 !important; color: #fff !important; }
    .ts-dropdown .option:hover, .ts-dropdown .active { background-color: #e94560 !important; color: #fff !important; }

    button.btn-submit {
      width: 100%; padding: 14px; margin-top: 25px; border-radius: 6px; border: none;
      font-size: 16px; background-color: #e94560; color: #ffffff; font-weight: bold; cursor: pointer;
    }
    button.btn-submit:disabled { background-color: #555555; cursor: not-allowed; opacity: 0.6; }
  </style>
</head>
<body>

  <div class="setup-card">
    <img src="logo-umno.png" alt="Logo UMNO" class="header-logo">
    <h2>BINA KARAKTER & LOKALITI</h2>

    <!-- 1. NAMA PEMAIN -->
    <div class="form-group">
      <label for="namaPemain">Nama Pemain / Gelaran:</label>
      <input type="text" id="namaPemain" placeholder="Masukkan nama anda..." oninput="semakBorang()">
    </div>

    <!-- 2. PILIHAN AVATAR -->
    <div class="form-group">
      <label>Pilih Avatar Pemain:</label>
      <div class="avatar-grid">
        <img src="avatar1.png" class="avatar-option selected" onclick="pilihAvatar(this, 'avatar1.png')">
        <img src="avatar2.png" class="avatar-option" onclick="pilihAvatar(this, 'avatar2.png')">
        <img src="avatar3.png" class="avatar-option" onclick="pilihAvatar(this, 'avatar3.png')">
      </div>
    </div>

    <!-- 3. PILIHAN TEMA BACKGROUND -->
    <div class="form-group">
      <label>Pilih Tema Latar Belakang Game:</label>
      <div class="theme-grid">
        <div class="theme-btn selected" onclick="pilihTema(this, 'dark')">Merah Dark</div>
        <div class="theme-btn" onclick="pilihTema(this, 'blue')">Biru Moden</div>
        <div class="theme-btn" onclick="pilihTema(this, 'gold')">Emas Klasik</div>
      </div>
    </div>

    <!-- 4. PILIHAN LOKALITI / CAWANGAN (GSHEETS) -->
    <div class="form-group">
      <label>Pilih Lokaliti / Cawangan:</label>
      <select id="selectLokaliti" placeholder="Memuatkan data cawangan..."><option value="">Memuatkan data...</option></select>
    </div>

    <button id="btnMula" class="btn-submit" disabled onclick="mulaGame()">MULA GAME & PERGI KE DASHBOARD</button>
  </div>

  <script>
    const gsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlY24kc_-2p4OtffqnoFRcTiQOGvjd2u-o_QuHkSzWVrYCEQbFTY2jJ8JSdBugsqwP0zS1q897ZS75/pub?output=csv';
    
    let avatarDipilih = 'avatar1.png';
    let temaDipilih = 'dark';

    // Tom Select Initialization
    const tomSelectControl = new TomSelect('#selectLokaliti', {
      create: false,
      sortField: { field: "text", direction: "asc" },
      placeholder: "Taip untuk cari cawangan..."
    });
    tomSelectControl.disable();

    // Read GSheets CSV
    Papa.parse(gsheetUrl, {
      download: true, header: true, skipEmptyLines: true,
      complete: function(results) {
        tomSelectControl.clearOptions();
        results.data.forEach(row => {
          const id = row['id'] || row['ID'] || Object.values(row)[0];
          const nama = row['nama'] || row['NAMA'] || Object.values(row)[1];
          if (nama) {
            tomSelectControl.addOption({ value: id ? id.trim() : nama.trim(), text: nama.trim() });
          }
        });
        tomSelectControl.enable();
        tomSelectControl.refreshOptions(false);
      }
    });

    function pilihAvatar(el, filename) {
      document.querySelectorAll('.avatar-option').forEach(img => img.classList.remove('selected'));
      el.classList.add('selected');
      avatarDipilih = filename;
    }

    function pilihTema(el, themeName) {
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('selected'));
      el.classList.add('selected');
      temaDipilih = themeName;
    }

    function semakBorang() {
      const nama = document.getElementById('namaPemain').value.trim();
      const lokaliti = tomSelectControl.getValue();
      document.getElementById('btnMula').disabled = !(nama !== "" && lokaliti !== "");
    }

    tomSelectControl.on('change', semakBorang);

    function mulaGame() {
      const selectedId = tomSelectControl.getValue();
      const selectedOption = tomSelectControl.options[selectedId];
      const selectedNama = selectedOption ? selectedOption.text : selectedId;

      // SIMPAN SEMUA DATA PEMAIN KE LOCALSTORAGE
      localStorage.setItem('playerNama', document.getElementById('namaPemain').value.trim());
      localStorage.setItem('playerAvatar', avatarDipilih);
      localStorage.setItem('playerTema', temaDipilih);
      localStorage.setItem('selectedLokalitiId', selectedId);
      localStorage.setItem('selectedLokalitiNama', selectedNama);

      // PINDAH KE DASHBOARD
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
