<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMNO Game</title>

  <!-- CSS Tom Select -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  
  <!-- JS Tom Select & PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* -----------------------------------
       1. SKRIN PILIH LOKALITI (FIRST PAGE)
    ----------------------------------- */
    #screenPilih {
      display: flex; /* Aktif secara asal */
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    .menu-box {
      background: #16213e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
    }

    .header-images {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo-img {
      width: 70px;
      height: auto;
    }

    .avatar-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #e94560;
      object-fit: cover;
    }

    h2 {
      margin-top: 10px;
      margin-bottom: 20px;
      color: #e94560;
      letter-spacing: 1px;
    }

    /* Reka Bentuk Tom Select Dark Mode */
    .ts-control {
      background-color: #0f3460 !important;
      color: #ffffff !important;
      border: 1px solid #1f4068 !important;
      border-radius: 6px !important;
      padding: 12px !important;
      font-size: 15px !important;
    }

    .ts-control input {
      color: #ffffff !important;
    }

    .ts-dropdown {
      background-color: #0f3460 !important;
      color: #ffffff !important;
      border: 1px solid #1f4068 !important;
      border-radius: 6px !important;
    }

    .ts-dropdown .option {
      padding: 10px 12px !important;
      color: #ffffff !important;
    }

    .ts-dropdown .option:hover, 
    .ts-dropdown .active {
      background-color: #e94560 !important;
      color: #ffffff !important;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      background-color: #e94560;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #ff6b81;
    }

    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .status-text {
      margin-top: 10px;
      font-size: 13px;
      color: #a0a0a0;
    }

    /* -----------------------------------
       2. SKRIN DASHBOARD / GAME (PAGE 2)
    ----------------------------------- */
    #screenDashboard {
      display: none; /* Sembunyi secara asal */
      width: 100%;
      max-width: 600px;
      background: #16213e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge-cawangan {
      background-color: #0f3460;
      color: #e94560;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      font-weight: bold;
      margin-bottom: 20px;
      border: 1px solid #e94560;
    }

    .game-area {
      background: #0f3460;
      padding: 40px 20px;
      border-radius: 8px;
      margin-top: 20px;
      border: 2px dashed #1f4068;
    }
  </style>
</head>
<body>

  <!-- Audio element untuk lagu latar -->
  <audio id="bgmAudio" loop preload="auto">
    <source src="lagu-bgm.mp3" type="audio/mpeg">
  </audio>

  <!-- ================= SKRIN 1: PILIH LOKALITI ================= -->
  <div id="screenPilih">
    <div class="menu-box">
      <div class="header-images">
        <img src="logo-umno.png" alt="Logo UMNO" class="logo-img">
        <img src="avatar.png" alt="Avatar Player" class="avatar-img">
      </div>

      <h2>PILIH LOKALITI</h2>

      <select id="selectLokaliti" placeholder="Memuatkan data cawangan..." autocomplete="off">
        <option value="">Memuatkan data...</option>
      </select>

      <div id="statusInfo" class="status-text">Membaca senarai dari Google Sheets...</div>

      <button id="btnMula" disabled onclick="mulaGame()">MULA GAME</button>
    </div>
  </div>

  <!-- ================= SKRIN 2: DASHBOARD GAME ================= -->
  <div id="screenDashboard">
    <div class="header-images">
      <img src="logo-umno.png" alt="Logo UMNO" class="logo-img">
      <img src="avatar.png" alt="Avatar Player" class="avatar-img">
    </div>

    <h2>DASHBOARD GAME</h2>
    
    <!-- Paparan Nama Cawangan yang dipilih -->
    <div class="badge-cawangan">
      Cawangan: <span id="paparCawangan">-</span>
    </div>

    <!-- Tempat letak elemen game anda -->
    <div class="game-area">
      <h3>Selamat Datang ke Game!</h3>
      <p>Lagu latar sedang dimainkan...</p>
      <!-- Masukkan komponen atau canvas game anda di sini -->
    </div>

    <button onclick="kembaliPilih()" style="background-color: #1f4068; margin-top: 20px;">
      Tukar Cawangan
    </button>
  </div>

  <script>
    const gsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlY24kc_-2p4OtffqnoFRcTiQOGvjd2u-o_QuHkSzWVrYCEQbFTY2jJ8JSdBugsqwP0zS1q897ZS75/pub?output=csv';

    const statusInfo = document.getElementById('statusInfo');
    const btnMula = document.getElementById('btnMula');
    const bgmAudio = document.getElementById('bgmAudio');

    // Inisialisasi Tom Select
    const tomSelectControl = new TomSelect('#selectLokaliti', {
      create: false,
      sortField: { field: "text", direction: "asc" },
      placeholder: "Taip untuk cari cawangan..."
    });

    tomSelectControl.disable();

    // Read Google Sheets CSV
    Papa.parse(gsheetUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        tomSelectControl.clearOptions();
        let totalRecords = 0;

        results.data.forEach(row => {
          const id = row['id'] || row['ID'] || row['Kod'] || row['kod'] || Object.values(row)[0];
          const nama = row['nama'] || row['NAMA'] || row['Lokaliti'] || row['lokaliti'] || Object.values(row)[1];

          if (nama) {
            tomSelectControl.addOption({
              value: id ? id.trim() : nama.trim(),
              text: nama.trim()
            });
            totalRecords++;
          }
        });

        tomSelectControl.enable();
        tomSelectControl.refreshOptions(false);
        statusInfo.textContent = `Pilih 1 daripada ${totalRecords} cawangan tersedia`;
      },
      error: function(err) {
        statusInfo.textContent = 'Gagal memuatkan data dari Google Sheets.';
      }
    });

    tomSelectControl.on('change', function(value) {
      btnMula.disabled = !value;
    });

    // FUNGSI UTAMA: PERTUKARAN SKRIN
    function mulaGame() {
      const selectedId = tomSelectControl.getValue();
      const selectedOption = tomSelectControl.options[selectedId];
      const selectedNama = selectedOption ? selectedOption.text : selectedId;

      // 1. Paparkan nama cawangan di Dashboard
      document.getElementById('paparCawangan').textContent = selectedNama;

      // 2. Sembunyikan Skrin Pilih, Tunjukkan Skrin Dashboard
      document.getElementById('screenPilih').style.display = 'none';
      document.getElementById('screenDashboard').style.display = 'block';

      // 3. Mainkan Lagu Latar
      bgmAudio.play().catch(error => {
        console.error("Gagal memainkan lagu:", error);
      });
    }

    // FUNGSI UNTUK TUKAR CAWANGAN SEMULA
    function kembaliPilih() {
      document.getElementById('screenDashboard').style.display = 'none';
      document.getElementById('screenPilih').style.display = 'flex';
      bgmAudio.pause(); // Hentikan lagu jika kembali
    }
  </script>

</body>
</html>
