<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Lokaliti - Game Start Page</title>

  <!-- CSS Tom Select -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  
  <!-- JS Tom Select & PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .menu-box {
      background: #16213e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #e94560;
      letter-spacing: 1px;
    }

    /* Kemaskini reka bentuk Tom Select mengikut tema game dark mode */
    .ts-control {
      background-color: #0f3460 !important;
      color: #ffffff !important;
      border: 1px solid #1f4068 !important;
      border-radius: 6px !important;
      padding: 12px !important;
      font-size: 15px !important;
    }

    .ts-control input {
      color: #ffffff !important;
    }

    .ts-dropdown {
      background-color: #0f3460 !important;
      color: #ffffff !important;
      border: 1px solid #1f4068 !important;
      border-radius: 6px !important;
    }

    .ts-dropdown .option {
      padding: 10px 12px !important;
      color: #ffffff !important;
    }

    .ts-dropdown .option:hover, 
    .ts-dropdown .active {
      background-color: #e94560 !important;
      color: #ffffff !important;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      background-color: #e94560;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #ff6b81;
    }

    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .status-text {
      margin-top: 10px;
      font-size: 13px;
      color: #a0a0a0;
    }
  </style>
</head>
<body>

  <div class="menu-box">
    <h2>PILIH LOKALITI</h2>

    <!-- Dropdown dengan carian -->
    <select id="selectLokaliti" placeholder="Memuatkan data cawangan..." autocomplete="off">
      <option value="">Memuatkan data...</option>
    </select>

    <div id="statusInfo" class="status-text">Membaca senarai dari Google Sheets...</div>

    <button id="btnMula" disabled onclick="mulaGame()">MULA GAME</button>
  </div>

  <script>
    // Pautan Google Sheets CSV anda
    const gsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlY24kc_-2p4OtffqnoFRcTiQOGvjd2u-o_QuHkSzWVrYCEQbFTY2jJ8JSdBugsqwP0zS1q897ZS75/pub?output=csv';

    const statusInfo = document.getElementById('statusInfo');
    const btnMula = document.getElementById('btnMula');

    // 1. Inisialisasi Tom Select (Dropdown dengan carian A-Z)
    const tomSelectControl = new TomSelect('#selectLokaliti', {
      create: false,
      sortField: {
        field: "text",
        direction: "asc" // Susun dari A hingga Z
      },
      placeholder: "Taip untuk cari cawangan..."
    });

    // Disable sementara muat turun data
    tomSelectControl.disable();

    // 2. Baca data CSV terus dari Google Sheets menggunakan PapaParse
    Papa.parse(gsheetUrl, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        tomSelectControl.clearOptions();
        let totalRecords = 0;

        results.data.forEach(row => {
          // Menggunakan header dalam GSheets
          // Jika header dalam GSheets anda berlainan (cth: 'KOD', 'NAMA LOKASI'), sila laraskan nama kunci di bawah
          const id = row['id'] || row['ID'] || row['Kod'] || row['kod'] || Object.values(row)[0];
          const nama = row['nama'] || row['NAMA'] || row['Lokaliti'] || row['lokaliti'] || Object.values(row)[1];

          if (nama) {
            tomSelectControl.addOption({
              value: id ? id.trim() : nama.trim(),
              text: nama.trim()
            });
            totalRecords++;
          }
        });

        tomSelectControl.enable();
        tomSelectControl.refreshOptions(false);
        statusInfo.textContent = `Pilih 1 daripada ${totalRecords} cawangan tersedia`;
      },
      error: function(err) {
        console.error('Ralat membaca Google Sheets:', err);
        statusInfo.textContent = 'Gagal memuatkan data dari Google Sheets.';
      }
    });

    // 3. Aktifkan/Nyahaktifkan butang Mula berdasarkan pilihan pemain
    tomSelectControl.on('change', function(value) {
      btnMula.disabled = !value;
    });

    // 4. Fungsi apabila butang "MULA GAME" ditekan
    function mulaGame() {
      const selectedId = tomSelectControl.getValue();
      const selectedOption = tomSelectControl.options[selectedId];
      const selectedNama = selectedOption ? selectedOption.text : selectedId;

      // Simpan ke localStorage untuk dibaca oleh game utama nanti
      localStorage.setItem('selectedLokalitiId', selectedId);
      localStorage.setItem('selectedLokalitiNama', selectedNama);

      alert(`Pilihan berjaya disimpan!\n\nCawangan: ${selectedNama}\nID: ${selectedId}`);

      // Tukar pautan ini ke halaman game utama anda jika perlu
      // window.location.href = "game.html";
    }
  </script>

</body>
</html>
